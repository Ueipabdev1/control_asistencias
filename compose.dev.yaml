name: control_asistencias_dev

services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: dev_root_only
      MARIADB_DATABASE: control_asistencias_dev
      MARIADB_USER: asistencias_dev
      MARIADB_PASSWORD: dev_user_only
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-3307}:3306"
    volumes:
      - dev_db_data:/var/lib/mysql
      - ./dev/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: dev/Dockerfile
    image: control_asistencias-dev-app:local
    environment:
      APP_ENV: development
      FLASK_ENV: development
      SECRET_KEY: dev_only_secret
      DATABASE_URL: mysql+pymysql://asistencias_dev:dev_user_only@db:3306/control_asistencias_dev?charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_APP_PORT:-5017}:5000"
    volumes:
      - .:/app
    command: ["flask", "--app", "app", "run", "--host", "0.0.0.0", "--port", "5000", "--debug"]

  validation:
    image: control_asistencias-dev-app:local
    profiles: ["validation"]
    environment:
      APP_ENV: development
      FLASK_ENV: development
      SECRET_KEY: dev_only_secret
      ENABLE_ACADEMIC_PERIOD_ADMIN: "1"
      DATABASE_URL: mysql+pymysql://asistencias_dev:dev_user_only@db:3306/control_asistencias_dev?charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5018:5000"
    volumes:
      - .:/app
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--timeout", "120", "app:app"]

  test:
    build:
      context: .
      dockerfile: dev/Dockerfile
    image: control_asistencias-dev-app:local
    profiles: ["test"]
    environment:
      APP_ENV: testing
      SECRET_KEY: test_only_secret
      DATABASE_URL: mysql+pymysql://asistencias_dev:dev_user_only@db:3306/control_asistencias_test?charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["pytest", "-q"]

volumes:
  dev_db_data:
